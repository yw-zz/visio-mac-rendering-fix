[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visio-mac-rendering-fix"
version = "0.1.0"
description = "Fix Visio (EMF+) figures that render wrong in Word/PowerPoint/Excel for Mac: italic labels, solid blocks instead of transparency."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["fonttools>=4.0"]
keywords = ["visio", "emf", "emf+", "office", "word", "powerpoint", "mac", "docx", "pptx"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
demo = ["python-docx", "python-pptx"]

[project.scripts]
visio-mac-rendering-fix = "visio_mac_rendering_fix.cli:main"

[project.urls]
Homepage = "https://github.com/yw-zz/visio-mac-rendering-fix"

[tool.setuptools.packages.find]
where = ["src"]
