[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visio-mac-rendering-fix"
version = "0.7.0"
description = "Fix Visio (EMF+) figures in Office files: wrong rendering in Office for Mac, and low-resolution pictures and rasterised SVGs in Word PDF exports."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["fonttools>=4.0"]
keywords = ["visio", "emf", "emf+", "office", "word", "powerpoint", "mac", "docx", "pptx", "pdf", "resolution"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23", "pillow>=9", "numpy"]
demo = ["pillow>=9", "python-docx", "python-pptx"]

[project.scripts]
visio-mac-rendering-fix = "visio_mac_rendering_fix.cli:main"
visio-pdf-hires = "visio_mac_rendering_fix.pdf_images:main"

[project.urls]
Homepage = "https://github.com/yw-zz/visio-mac-rendering-fix"

[tool.setuptools.packages.find]
where = ["src"]
